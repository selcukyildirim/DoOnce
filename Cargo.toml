[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/doonce/doonce"
rust-version = "1.88"

[workspace.dependencies]
doonce-core = { path = "crates/doonce-core", version = "0.1.0" }
doonce-security = { path = "crates/doonce-security", version = "0.1.0" }
doonce-store = { path = "crates/doonce-store", version = "0.1.0" }
doonce-browser = { path = "crates/doonce-browser", version = "0.1.0" }
doonce-engine = { path = "crates/doonce-engine", version = "0.1.0" }
doonce-llm = { path = "crates/doonce-llm", version = "0.1.0" }
doonce-agent = { path = "crates/doonce-agent", version = "0.1.0" }
doonce-server = { path = "crates/doonce-server", version = "0.1.0" }
doonce-services = { path = "crates/doonce-services", version = "0.1.0" }
doonce-worker = { path = "crates/doonce-worker", version = "0.1.0" }

anyhow = "1"
axum = { version = "0.8", features = ["json", "macros"] }
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
rand = "0.8"
jsonschema = "0.26"
jsonlogic = "0.5"
boa_engine = "0.20"
csv = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
mime_guess = "2"
hmac = "0.12"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "any",
    "sqlite",
    "postgres",
    "migrate",
    "macros",
] }
tempfile = "3"
thiserror = "2"
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
tokio-tungstenite = "0.27"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs", "request-id", "set-header", "timeout"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "fs",
    "signal",
    "process",
    "net",
    "io-util",
    "io-std",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
