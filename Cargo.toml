[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/doonce/doonce"
rust-version = "1.88"

[workspace.dependencies]
doonce-core = { path = "crates/doonce-core" }
doonce-engine = { path = "crates/doonce-engine" }
doonce-storage = { path = "crates/doonce-storage" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "io-std", "net", "fs", "signal"] }
tokio-tungstenite = "0.27"
tokio-util = "0.7"
url = "2"

[profile.release]
lto = "thin"
strip = true
