[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is pulled in by openidconnect for public-key ID-token signature verification; the vulnerable PKCS#1 v1.5 decryption path is not exposed. Mitigations: trusted issuer allowlist, HTTPS-only discovery, short token lifetimes, JWKS signature verification. Track upstream replacement." },
    { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time proc-macro dependency of Boa (the JS sandbox). It is not runtime-reachable and has no known vulnerability. Track Boa releases and remove when upstream replaces it." },
    { id = "RUSTSEC-2026-0459", reason = "Transitive via sqlx 0.8 libsqlite3-sys 0.30.1 (bundled SQLite < 3.54). DoOnce only opens its own trusted database files; the attack needs a less-trusted party to plant a crafted -wal sibling. Track sqlx 0.9 migration." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OpenSSL",
]
exceptions = [
    { name = "r-efi", allow = ["MIT"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl-sys", reason = "Prefer rustls for portable, audited TLS." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
