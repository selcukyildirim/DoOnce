<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Help center · Acme Portal</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body>
  <header><strong>Acme Help</strong></header>
  <main>
    <h1>Help center</h1>
    <section class="card">
      <h2>Frequently asked</h2>

    </section>
  </main>

</html>
